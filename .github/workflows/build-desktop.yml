name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: InvoiceRenamer-windows
          - name: macOS
            os: macos-latest
            artifact: InvoiceRenamer-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Tesseract on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          choco install innosetup --no-progress -y
          echo "TESSERACT_ROOT=C:\Program Files\Tesseract-OCR" >> $env:GITHUB_ENV

      - name: Install Tesseract on macOS
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Prepare bundled Tesseract runtime
        run: python scripts/prepare_tesseract.py

      - name: Build desktop app
        run: pyinstaller --noconfirm InvoiceRenamer.spec

      - name: Download WebView2 bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-assets | Out-Null
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "build-assets\MicrosoftEdgeWebview2Setup.exe"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          $env:APP_VERSION = "${{ github.ref_name }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\InvoiceRenamer.iss
          Copy-Item dist\installer\InvoiceRenamerSetup.exe InvoiceRenamerSetup.exe

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/create_macos_dmg.sh
          scripts/create_macos_dmg.sh
          cp dist/InvoiceRenamer-macos.dmg InvoiceRenamer-macos.dmg

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: InvoiceRenamerSetup.exe

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: InvoiceRenamer-macos.dmg
