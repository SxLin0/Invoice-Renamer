<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰冰发票改名器</title>
    <link rel="icon" href="{{ url_for('static', filename='icon.jpg') }}" type="image/jpeg">
    <style>
        :root {
            --bg: #f4f1ec;
            --panel: #fffdf9;
            --panel-soft: #faf6ef;
            --line: #e5d9c8;
            --text: #22211f;
            --muted: #6f6962;
            --accent: #0f766e;
            --accent-dark: #115e59;
            --warn: #b42318;
            --ok: #15803d;
            --shadow: 0 18px 45px rgba(42, 35, 28, 0.12);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                linear-gradient(135deg, rgba(15, 118, 110, 0.10), transparent 42%),
                var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }

        button,
        input {
            font: inherit;
        }

        .shell {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .brand img {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: 0 8px 20px rgba(42, 35, 28, 0.14);
        }

        h1 {
            margin: 0;
            font-size: 26px;
            line-height: 1.2;
        }

        .tagline {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(330px, 0.85fr);
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: rgba(255, 253, 249, 0.92);
            border: 1px solid rgba(229, 217, 200, 0.92);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(250, 246, 239, 0.72);
        }

        .panel-title {
            margin: 0;
            font-size: 17px;
            line-height: 1.2;
        }

        .panel-note {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .panel-body {
            padding: 20px;
        }

        .upload-box {
            display: grid;
            place-items: center;
            min-height: 270px;
            padding: 28px;
            text-align: center;
            border: 1.5px dashed #9ca38f;
            border-radius: var(--radius);
            background: linear-gradient(180deg, #fffdf9, #f7f2e9);
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
        }

        .upload-box:hover,
        .upload-box.hover {
            border-color: var(--accent);
            background: linear-gradient(180deg, #ffffff, #eef8f6);
            transform: translateY(-1px);
        }

        .upload-symbol {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            border-radius: 50%;
            color: var(--accent-dark);
            background: #dff3ef;
            font-size: 34px;
            font-weight: 700;
        }

        .upload-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .upload-hint {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .file-list,
        .res-list {
            display: grid;
            gap: 10px;
            max-height: 300px;
            margin-top: 16px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .file-item,
        .res-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
        }

        .res-item.success {
            border-left: 4px solid var(--ok);
        }

        .res-item.error {
            border-left: 4px solid var(--warn);
        }

        .name {
            min-width: 0;
            overflow-wrap: anywhere;
            font-weight: 650;
        }

        .meta,
        .size {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .amount {
            color: var(--ok);
            font-size: 18px;
            font-weight: 750;
        }

        .error-msg {
            color: var(--warn);
            font-size: 13px;
            font-weight: 650;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .output-path-row {
            display: none;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            margin-top: 14px;
        }

        .output-path-row.visible {
            display: grid;
        }

        .output-path-row input {
            min-width: 0;
            min-height: 40px;
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #fff;
        }

        .btn {
            min-height: 40px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            padding: 9px 14px;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            font-weight: 650;
            text-decoration: none;
            transition: background 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
        }

        .btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.48;
            transform: none;
        }

        .btn.secondary {
            color: var(--text);
            border-color: var(--line);
            background: #fff;
        }

        .btn.secondary:hover {
            background: var(--panel-soft);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel-soft);
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-dark);
        }

        .stat-label {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .empty-state {
            display: grid;
            place-items: center;
            min-height: 188px;
            margin-top: 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--muted);
            background: var(--panel-soft);
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 820px) {
            .shell {
                width: min(100% - 24px, 640px);
                padding: 20px 0;
            }

            .topbar,
            .workspace {
                display: block;
            }

            .panel {
                margin-top: 14px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <img src="{{ url_for('static', filename='icon.jpg') }}" alt="应用图标">
                <div>
                    <h1>冰冰发票改名器</h1>
                    <p class="tagline">批量识别 PDF 发票金额，并按金额自动改名。</p>
                </div>
            </div>
        </header>

        <main class="workspace">
            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title">上传发票</h2>
                        <p class="panel-note">支持一次选择多份 PDF。</p>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="upload-box" id="uploadBox" role="button" tabindex="0">
                        <div>
                            <div class="upload-symbol">+</div>
                            <p class="upload-title">选择或拖入 PDF 文件</p>
                            <p class="upload-hint">处理后会生成类似 15.81.pdf 的文件名。</p>
                        </div>
                    </div>
                    <input type="file" id="fileInput" multiple accept=".pdf">
                    <div class="file-list" id="fileList"></div>
                    <div class="actions">
                        <button class="btn" id="goBtn" disabled>开始处理</button>
	                        <button class="btn secondary" id="clearBtn">清空列表</button>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title">处理结果</h2>
                        <p class="panel-note" id="resultNote">完成后可单个下载，也可打包下载。</p>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="statTotal">0</div>
                            <div class="stat-label">总文件</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="statOk">0</div>
                            <div class="stat-label">成功</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="statTotalAmount">¥0.00</div>
                            <div class="stat-label">总金额</div>
                        </div>
                    </div>
                    <div class="empty-state" id="emptyState">等待上传文件</div>
                    <div class="res-list" id="resList"></div>
                    <div class="output-path-row" id="manualOutputRow">
                        <input id="manualOutputPath" type="text" placeholder="也可以粘贴输出文件夹路径">
                        <button class="btn secondary" id="saveOutputPathBtn">保存路径</button>
                    </div>
                    <div class="actions">
                        <button class="btn secondary" id="chooseOutputBtn" hidden>选择输出文件夹</button>
                        <button class="btn" id="openOutputBtn" hidden>打开输出文件夹</button>
                        <button class="btn secondary" id="downloadAllBtn">打包下载</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const goBtn = document.getElementById('goBtn');
        const clearBtn = document.getElementById('clearBtn');
        const uploadBox = document.getElementById('uploadBox');
        const statTotal = document.getElementById('statTotal');
        const statOk = document.getElementById('statOk');
        const statTotalAmount = document.getElementById('statTotalAmount');
        const resList = document.getElementById('resList');
        const emptyState = document.getElementById('emptyState');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const chooseOutputBtn = document.getElementById('chooseOutputBtn');
        const openOutputBtn = document.getElementById('openOutputBtn');
        const resultNote = document.getElementById('resultNote');
        const manualOutputRow = document.getElementById('manualOutputRow');
        const manualOutputPath = document.getElementById('manualOutputPath');
        const saveOutputPathBtn = document.getElementById('saveOutputPathBtn');
        let files = [];
        let processedResults = [];
        let desktopMode = false;
        let outputFolder = '';

        async function loadAppInfo() {
            const response = await fetch('/app-info');
            const info = await response.json();
            desktopMode = Boolean(info.desktop);
            outputFolder = info.output_folder || '';
            chooseOutputBtn.hidden = !desktopMode;
            openOutputBtn.hidden = !desktopMode;
            downloadAllBtn.hidden = desktopMode;
            manualOutputRow.classList.toggle('visible', desktopMode);
            manualOutputPath.value = outputFolder;
            resultNote.textContent = desktopMode
                ? `处理后的文件会直接保存到：${outputFolder || '未选择'}`
                : '完成后可单个下载，也可打包下载。';
        }

        function withTimeout(promise, milliseconds) {
            return Promise.race([
                promise,
                new Promise((resolve) => setTimeout(() => resolve({ timedOut: true }), milliseconds)),
            ]);
        }

        async function setOutputFolderFromInput() {
            const path = manualOutputPath.value.trim();
            if (!path) {
                alert('请填写输出文件夹路径');
                return false;
            }
            const response = await fetch('/set-output-folder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path }),
            });
            const data = await response.json();
            if (!response.ok) {
                alert(data.error || '设置输出文件夹失败');
                return false;
            }
            outputFolder = data.output_folder;
            manualOutputPath.value = outputFolder;
            resultNote.textContent = `处理后的文件会直接保存到：${outputFolder}`;
            return true;
        }

        async function chooseOutputFolder() {
            if (!window.pywebview || !window.pywebview.api) {
                return false;
            }
            const result = await withTimeout(window.pywebview.api.select_output_folder(), 3000);
            if (result && result.timedOut) {
                alert('系统文件夹选择窗口没有响应，可以直接粘贴输出文件夹路径。');
                return false;
            }
            if (result && result.output_folder) {
                outputFolder = result.output_folder;
                manualOutputPath.value = outputFolder;
                resultNote.textContent = `处理后的文件会直接保存到：${outputFolder}`;
            }
            return Boolean(result && result.selected);
        }

        function formatSize(bytes) {
            return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
        }

        function createText(className, text) {
            const element = document.createElement('div');
            element.className = className;
            element.textContent = text;
            return element;
        }

        function renderSelectedFiles() {
            fileList.innerHTML = '';
            files.forEach((file) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                const details = document.createElement('div');
                details.appendChild(createText('name', file.name));
                details.appendChild(createText('size', formatSize(file.size)));
                item.appendChild(details);
                fileList.appendChild(item);
            });
            goBtn.disabled = files.length === 0;
        }

        function fileKey(file) {
            return `${file.name}-${file.size}-${file.lastModified}`;
        }

        function addFiles(fileListLike) {
            const existingKeys = new Set(files.map(fileKey));
            const newFiles = Array.from(fileListLike)
                .filter((file) => file.name.toLowerCase().endsWith('.pdf'))
                .filter((file) => !existingKeys.has(fileKey(file)));
            files = [...files, ...newFiles];
            renderSelectedFiles();
        }

        async function uploadFiles() {
            const formData = new FormData();
            files.forEach((file) => formData.append('files', file));
            goBtn.disabled = true;
            goBtn.textContent = '处理中...';
            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                showResults(await response.json());
            } finally {
                goBtn.disabled = files.length === 0;
                goBtn.textContent = '开始处理';
            }
        }

        function showResults(data) {
            processedResults.push(...(data.results || []));
            const successResults = processedResults.filter((result) => result.success);
            const totalAmount = successResults.reduce((sum, result) => sum + parseFloat(result.amount || 0), 0);

            statTotal.textContent = processedResults.length;
            statOk.textContent = successResults.length;
            statTotalAmount.textContent = `¥${totalAmount.toFixed(2)}`;
            resList.innerHTML = '';
            emptyState.style.display = processedResults.length ? 'none' : 'grid';

            processedResults.forEach((result) => {
                const item = document.createElement('div');
                item.className = `res-item ${result.success ? 'success' : 'error'}`;

                const details = document.createElement('div');
                details.appendChild(createText('name', result.original_filename));
                if (result.success) {
                    details.appendChild(createText('amount', `¥${parseFloat(result.amount || 0).toFixed(2)}`));
                    details.appendChild(createText('meta', `已生成：${result.new_filename}`));
                } else {
                    details.appendChild(createText('error-msg', result.error || '处理失败'));
                }
                item.appendChild(details);

                if (result.success && !desktopMode) {
                    const link = document.createElement('a');
                    link.className = 'btn';
                    link.href = `/download/${encodeURIComponent(result.new_filename)}`;
                    link.textContent = '下载';
                    item.appendChild(link);
                }
                resList.appendChild(item);
            });
        }

        function clearCurrentList() {
            files = [];
            processedResults = [];
            fileInput.value = '';
            renderSelectedFiles();
            showResults({ total_files: 0, processed_files: 0, total_amount: 0, results: [] });
        }

        uploadBox.addEventListener('click', () => fileInput.click());
        uploadBox.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                fileInput.click();
            }
        });
        fileInput.addEventListener('change', () => {
            addFiles(fileInput.files);
            fileInput.value = '';
        });
        goBtn.addEventListener('click', uploadFiles);
        clearBtn.addEventListener('click', clearCurrentList);
        chooseOutputBtn.addEventListener('click', chooseOutputFolder);
        saveOutputPathBtn.addEventListener('click', setOutputFolderFromInput);
        downloadAllBtn.addEventListener('click', () => {
            window.location.href = '/download-all';
        });
        openOutputBtn.addEventListener('click', async () => {
            const response = await fetch('/open-output-folder', { method: 'POST' });
            const data = await response.json();
            if (!response.ok) {
                alert(data.error || '打开输出文件夹失败');
            }
        });

        ['dragover', 'dragleave', 'drop'].forEach((eventName) => {
            uploadBox.addEventListener(eventName, (event) => event.preventDefault());
        });
        uploadBox.addEventListener('dragover', () => uploadBox.classList.add('hover'));
        uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('hover'));
        uploadBox.addEventListener('drop', (event) => {
            uploadBox.classList.remove('hover');
            addFiles(event.dataTransfer.files);
        });
        loadAppInfo();
    </script>
</body>

</html>
